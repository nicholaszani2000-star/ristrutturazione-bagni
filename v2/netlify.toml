# Pubblicazione di EasyBagno.it su Netlify.
#
# build:netlify produce l'export statico in out/ con percorsi assoluti, che
# sono quelli giusti per un hosting. I percorsi relativi e i font incorporati
# appartengono a build:offline, cioe' al pacchetto che si apre con doppio clic.

[build]
  command = "npm run build:netlify"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Gli asset hanno l'impronta nel nome: non cambiano mai a parita' di nome.
# L'HTML invece deve poter cambiare a ogni pubblicazione.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sicurezza di base su tutte le pagine. Niente Content-Security-Policy:
# con GA4, Meta e Supabase caricati solo dopo il consenso, una CSP sbagliata
# bloccherebbe il tracciamento in silenzio, ed e' un guasto che non si vede.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
