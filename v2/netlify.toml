# Pubblicazione di EasyBagno.it su Netlify.
#
# build:netlify produce l'export statico in out/ con percorsi assoluti, che
# sono quelli giusti per un hosting. I percorsi relativi e i font incorporati
# appartengono a build:offline, cioe' al pacchetto che si apre con doppio clic.

[build]
  command = "npm run build:netlify"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # Gia' impostata dal comando di build, ma la ripeto qui perche' la vedano
  # anche i plugin che Netlify aggiunge da solo ai progetti Next.js: devono
  # sapere che questo e' un sito statico e non cercare un server.
  PREVIEW_EXPORT = "1"

# Intestazioni e reindirizzamenti stanno in public/_headers e
# public/_redirects: sono gli unici che Netlify legge anche quando il sito
# viene pubblicato trascinando la cartella, senza passare da una build.
