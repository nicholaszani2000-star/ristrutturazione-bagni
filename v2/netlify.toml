# Pubblicazione di EasyBagno.it su Netlify.
#
# build:netlify produce l'export statico in out/ con percorsi assoluti, che
# sono quelli giusti per un hosting. I percorsi relativi e i font incorporati
# appartengono a build:offline, cioe' al pacchetto che si apre con doppio clic.

[build]
  command = "npm run build:netlify"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Gli asset hanno l'impronta nel nome: non cambiano mai a parita' di nome.
# L'HTML invece deve poter cambiare a ogni pubblicazione.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
