<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="pTitle pDesc">
  <title id="pTitle">Bagno prima della ristrutturazione</title>
  <desc id="pDesc">Illustrazione di un bagno datato con piastrelle beige, vasca con tenda, lavabo a colonna e tubature a vista.</desc>
  <defs>
    <linearGradient id="pFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8CCB8"/><stop offset="1" stop-color="#E8E0D2"/>
    </linearGradient>
    <linearGradient id="pTub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2EFE6"/><stop offset="1" stop-color="#DED8C9"/>
    </linearGradient>
    <clipPath id="pClip"><rect width="800" height="600"/></clipPath>
  </defs>

  <g clip-path="url(#pClip)">
    <!-- pareti: piastrelle beige piccole, fughe scure -->
    <rect width="800" height="600" fill="#E6DFD2"/>
    <rect x="0" y="0" width="800" height="472" fill="#EDE7DB"/>
    <g stroke="#CFC3AE" stroke-width="2.5">
      <path d="M0 78h800M0 156h800M0 234h800M0 312h800M0 390h800"/>
      <path d="M78 0v472M156 0v472M234 0v472M312 0v472M390 0v472M468 0v472M546 0v472M624 0v472M702 0v472M780 0v472"/>
    </g>
    <!-- macchie di umidita' -->
    <ellipse cx="120" cy="120" rx="58" ry="34" fill="#D8CDB8" opacity="0.55"/>
    <ellipse cx="640" cy="92" rx="42" ry="26" fill="#D8CDB8" opacity="0.45"/>
    <path d="M300 0v96" stroke="#CBBBA2" stroke-width="3" opacity="0.7"/>

    <!-- pavimento datato -->
    <rect x="0" y="472" width="800" height="128" fill="url(#pFloor)"/>
    <g stroke="#B5A78F" stroke-width="2.5" opacity="0.85">
      <path d="M0 520h800M0 566h800M70 472v128M170 472v128M270 472v128M370 472v128M470 472v128M570 472v128M670 472v128M770 472v128"/>
    </g>
    <rect x="0" y="464" width="800" height="10" fill="#C2B49B"/>

    <!-- ===== VASCA CON TENDA (a sinistra) ===== -->
    <!-- bastone tenda -->
    <rect x="62" y="112" width="244" height="7" rx="3.5" fill="#A2937C"/>
    <!-- tenda scostata su un lato, orlo ondulato -->
    <path d="M198 119h104v292q-26 12-52 0t-52 0Z" fill="#E9E4D8"/>
    <g stroke="#D3CBBA" stroke-width="3">
      <path d="M214 119v296M232 119v300M250 119v300M268 119v300M286 119v296"/>
    </g>
    <path d="M198 119h104v10h-104Z" fill="#DCD5C5"/>
    <!-- vasca -->
    <path d="M66 340h236v92a26 26 0 0 1-26 26H92a26 26 0 0 1-26-26Z" fill="url(#pTub)" stroke="#C6BCA8" stroke-width="3"/>
    <rect x="66" y="330" width="236" height="16" rx="7" fill="#F4F1E9" stroke="#C6BCA8" stroke-width="2.5"/>
    <!-- rubinetto vecchio che gocciola -->
    <rect x="96" y="286" width="10" height="46" rx="5" fill="#A0937E"/>
    <rect x="84" y="280" width="46" height="11" rx="5.5" fill="#A0937E"/>
    <circle cx="121" cy="306" r="5" fill="#BFD4E0"/>
    <circle cx="121" cy="330" r="3.5" fill="#BFD4E0" opacity="0.75"/>
    <!-- alone di ruggine -->
    <ellipse cx="121" cy="356" rx="20" ry="7" fill="#C8B28F" opacity="0.5"/>

    <!-- ===== LAVABO A COLONNA (a destra) ===== -->
    <!-- specchietto quadrato con cornice spessa; il riflesso e' una
         banda diagonale, non un paesaggio, altrimenti sembra un quadro -->
    <rect x="432" y="150" width="136" height="104" rx="4" fill="#D5DCDA" stroke="#A0937E" stroke-width="7"/>
    <path d="M444 254l52-104h26l-52 104Z" fill="#E6EBE9" opacity=".85"/>
    <path d="M498 254l22-104h11l-22 104Z" fill="#E6EBE9" opacity=".55"/>
    <!-- lampadina nuda -->
    <path d="M500 112v26" stroke="#A0937E" stroke-width="4"/>
    <circle cx="500" cy="146" r="12" fill="#EFE6C9" stroke="#A0937E" stroke-width="3"/>

    <!-- lavabo -->
    <path d="M430 330h140l-12 34H442Z" fill="#F2EFE6" stroke="#C6BCA8" stroke-width="3"/>
    <rect x="424" y="318" width="152" height="16" rx="7" fill="#F4F1E9" stroke="#C6BCA8" stroke-width="2.5"/>
    <path d="M482 364h36v76h-36Z" fill="#EDE9DE" stroke="#C6BCA8" stroke-width="3"/>
    <path d="M470 440h60v18h-60Z" fill="#E4DFD2" stroke="#C6BCA8" stroke-width="2.5"/>
    <!-- rubinetto -->
    <rect x="494" y="292" width="10" height="28" rx="5" fill="#A0937E"/>
    <rect x="482" y="286" width="34" height="10" rx="5" fill="#A0937E"/>

    <!-- tubature a vista -->
    <g stroke="#A0937E" stroke-width="9" fill="none" stroke-linecap="round">
      <path d="M612 300v150"/>
      <path d="M612 300h-28"/>
    </g>
    <circle cx="612" cy="372" r="11" fill="#B3A389"/>

    <!-- vecchio radiatore a colonne -->
    <g fill="#D8D2C4" stroke="#B7AB95" stroke-width="2.5">
      <rect x="682" y="300" width="15" height="150" rx="7"/>
      <rect x="704" y="300" width="15" height="150" rx="7"/>
      <rect x="726" y="300" width="15" height="150" rx="7"/>
      <rect x="748" y="300" width="15" height="150" rx="7"/>
    </g>

  </g>
</svg>
