<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="heroTitle heroDesc" width="800" height="600">
  <title id="heroTitle">Bagno ristrutturato chiavi in mano</title>
  <desc id="heroDesc">Illustrazione di un bagno moderno con doccia walk-in, mobile lavabo con specchio tondo e termoarredo.</desc>

  <defs>
    <linearGradient id="hGradBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143A5C"/><stop offset="0.55" stop-color="#1B84DD"/><stop offset="1" stop-color="#56B4EE"/>
    </linearGradient>
    <linearGradient id="hGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#56B4EE" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#1B84DD" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="hCabinet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B4B77"/><stop offset="1" stop-color="#143A5C"/>
    </linearGradient>
    <linearGradient id="hFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE9F3"/><stop offset="1" stop-color="#EFF6FB"/>
    </linearGradient>
    <linearGradient id="hMirror" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#EAF4FC"/><stop offset="1" stop-color="#F8FCFE"/>
    </linearGradient>
    <clipPath id="hClipShower"><rect x="66" y="96" width="232" height="374" rx="6"/></clipPath>
  </defs>

  <!-- fondo e pareti -->
  <rect width="800" height="600" fill="#F5F9FC"/>
  <rect x="0" y="0" width="800" height="472" fill="#FBFDFE"/>

  <!-- fughe delle piastrelle a parete -->
  <g stroke="#E2ECF3" stroke-width="2">
    <path d="M0 118h800M0 236h800M0 354h800"/>
    <path d="M150 0v472M340 0v472M530 0v472M690 0v472"/>
  </g>

  <!-- pavimento -->
  <rect x="0" y="472" width="800" height="128" fill="url(#hFloor)"/>
  <g stroke="#CFE0EE" stroke-width="2" opacity="0.8">
    <path d="M0 520h800M0 566h800"/>
  </g>

  <!-- ===== DOCCIA WALK-IN ===== -->
  <g clip-path="url(#hClipShower)">
    <rect x="66" y="96" width="232" height="376" fill="#EEF6FC"/>
    <!-- mosaico di fondo doccia -->
    <g stroke="#DBEAF6" stroke-width="2">
      <path d="M66 160h232M66 224h232M66 288h232M66 352h232M66 416h232"/>
      <path d="M130 96v376M194 96v376M258 96v376"/>
    </g>
  </g>
  <rect x="66" y="96" width="232" height="376" rx="6" fill="none" stroke="#D3E4F1" stroke-width="3"/>

  <!-- soffione a pioggia -->
  <g fill="#143A5C">
    <rect x="176" y="120" width="8" height="30" rx="4"/>
    <rect x="130" y="146" width="100" height="12" rx="6"/>
  </g>
  <!-- getti d'acqua -->
  <g stroke="#56B4EE" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <path d="M148 176v54M170 176v78M192 176v62M214 176v40"/>
  </g>

  <!-- piatto doccia e scarico -->
  <rect x="78" y="440" width="208" height="26" rx="8" fill="#FFFFFF" stroke="#D3E4F1" stroke-width="2"/>
  <rect x="160" y="449" width="44" height="7" rx="3.5" fill="#C6D9E8"/>

  <!-- vetro della doccia -->
  <rect x="276" y="112" width="26" height="356" rx="4" fill="url(#hGlass)"/>
  <rect x="276" y="112" width="26" height="356" rx="4" fill="none" stroke="#9CCDF0" stroke-width="3"/>
  <rect x="286" y="150" width="5" height="120" rx="2.5" fill="#FFFFFF" opacity="0.65"/>

  <!-- ===== MOBILE LAVABO ===== -->
  <!-- specchio tondo -->
  <circle cx="500" cy="196" r="88" fill="url(#hMirror)" stroke="url(#hGradBrand)" stroke-width="7"/>
  <path d="M462 158a54 54 0 0 1 34-20" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- rubinetto -->
  <g fill="#143A5C">
    <rect x="494" y="286" width="11" height="46" rx="5.5"/>
    <path d="M499.5 286c0-24 34-24 34 0v10" fill="none" stroke="#143A5C" stroke-width="11" stroke-linecap="round"/>
  </g>

  <!-- top e lavabo -->
  <rect x="352" y="330" width="296" height="18" rx="6" fill="#FFFFFF" stroke="#DCE9F3" stroke-width="2"/>
  <rect x="470" y="300" width="128" height="34" rx="12" fill="#FFFFFF" stroke="#DCE9F3" stroke-width="2"/>

  <!-- base mobile -->
  <rect x="366" y="348" width="268" height="112" rx="10" fill="url(#hCabinet)"/>
  <path d="M500 348v112" stroke="#0F2E4A" stroke-width="2.5" opacity="0.6"/>
  <rect x="424" y="396" width="56" height="7" rx="3.5" fill="#56B4EE"/>
  <rect x="520" y="396" width="56" height="7" rx="3.5" fill="#56B4EE"/>

  <!-- asciugamano arrotolato sul top -->
  <rect x="378" y="306" width="62" height="26" rx="13" fill="#EAF4FC" stroke="#D3E4F1" stroke-width="2"/>
  <path d="M409 306v26" stroke="#CFE0EE" stroke-width="2"/>

  <!-- ===== TERMOARREDO ===== -->
  <g stroke="#1B84DD" stroke-width="9" stroke-linecap="round">
    <path d="M700 168v250M760 168v250"/>
  </g>
  <g stroke="#56B4EE" stroke-width="7" stroke-linecap="round">
    <path d="M700 196h60M700 238h60M700 280h60M700 322h60M700 364h60"/>
  </g>
  <!-- asciugamano appeso -->
  <rect x="712" y="238" width="36" height="96" rx="8" fill="#FFFFFF" stroke="#D3E4F1" stroke-width="2"/>

  <!-- battiscopa -->
  <rect x="0" y="466" width="800" height="8" fill="#E2ECF3"/>
</svg>
