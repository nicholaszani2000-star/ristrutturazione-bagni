<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="ebLogoTitle">
  <title id="ebLogoTitle">Easy-Bagno.it — ristrutturazione bagni chiavi in mano</title>
  <defs>
    <linearGradient id="ebGrad" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#143A5C"/>
      <stop offset="0.55" stop-color="#1B84DD"/>
      <stop offset="1" stop-color="#56B4EE"/>
    </linearGradient>
    <!-- Ritaglia lavabo, rubinetto e goccia dalla sagoma della casa -->
    <mask id="ebMask">
      <rect width="64" height="64" fill="#fff"/>
      <!-- rubinetto: montante + braccio -->
      <rect x="30.2" y="16.6" width="3.6" height="16" rx="1.5" fill="#000"/>
      <rect x="24.4" y="16.6" width="9.4" height="3.6" rx="1.8" fill="#000"/>
      <!-- goccia d'acqua -->
      <path d="M26.4 22.8c1.9 2.3 2.9 3.8 2.9 4.9a2.9 2.9 0 0 1-5.8 0c0-1.1 1-2.6 2.9-4.9Z" fill="#000"/>
      <!-- lavabo -->
      <path d="M19.4 32.4h25.2v1.9a12.6 12.6 0 0 1-25.2 0Z" fill="#000"/>
    </mask>
  </defs>

  <!-- sagoma casa -->
  <path d="M32 3.6 58.6 25.2V46a6.4 6.4 0 0 1-6.4 6.4H11.8A6.4 6.4 0 0 1 5.4 46V25.2Z"
        fill="url(#ebGrad)" mask="url(#ebMask)" stroke-linejoin="round"/>

  <!-- onda su cui appoggia la casa -->
  <path d="M4 56.4q7.5-6 15 0t15 0t15 0" fill="none" stroke="url(#ebGrad)"
        stroke-width="4.6" stroke-linecap="round"/>
</svg>
