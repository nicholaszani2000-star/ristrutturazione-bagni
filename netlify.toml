# Il sito vive in v2/. Questa riga basta a Netlify per andarci da solo,
# anche se nelle impostazioni del progetto la "Base directory" resta vuota:
# da li' legge v2/netlify.toml, che contiene comando, cartella e intestazioni.
#
# Senza, un collegamento del repo con le impostazioni predefinite avrebbe
# cercato un sito nella radice. Verificato con @netlify/config.
[build]
  base = "v2"
